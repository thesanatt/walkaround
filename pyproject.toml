[project]
name = "walkaround"
version = "0.1.0"
description = "Turn the two videos you already take of a rental car into a dated, panel-by-panel evidence sheet."
requires-python = ">=3.13"
dependencies = [
    "openai>=2.0",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "httpx>=0.27",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
]

[project.scripts]
walkaround = "walkaround.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walkaround"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
